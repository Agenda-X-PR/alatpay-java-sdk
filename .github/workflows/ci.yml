# The name of the workflow. This is what will show up in the "Actions" tab.
name: Java CI with Maven

# This is the trigger. It tells GitHub to run this workflow on:
# - Every "push" to the 'main' branch.
# - Every "pull_request" that targets the 'main' branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A workflow is made of one or more jobs. We'll use a single job called "build".
jobs:
  build:
    # The type of machine to run on. A standard, fresh Ubuntu machine is perfect.
    runs-on: ubuntu-latest

    # These are the steps that make up the "build" job. They run in order.
    steps:
    # Step 1: Check out your repository's code onto the runner.
    - uses: actions/checkout@v4

    # Step 2: Set up the Java Development Kit (JDK).
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        # Install the Temurin distribution of Java.
        distribution: 'temurin'
        # Use Java version 21, matching our pom.xml.
        java-version: '21'
        # Tell the action to cache Maven dependencies to speed up future runs.
        cache: 'maven'

    # Step 3: Run the build and tests.
    - name: Build and test with Maven
      # The '-B' flag means "batch mode" (no interactive prompts).
      # 'clean test' ensures a fresh build and runs all unit tests.
      run: mvn -B clean test