name: Release to Maven Central

# This workflow runs only when a version tag is pushed.
# Example: git tag -a v1.0.0 -m "Release 1.0.0" && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          # GPG signing config for Maven Central
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven settings
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B clean deploy -P release

# NOTE: This workflow will not succeed until you:
#
# 1. Create a Sonatype OSSRH account:
#    https://central.sonatype.org/publish/publish-guide/
#
# 2. Generate a GPG key for signing:
#    gpg --gen-key
#    gpg --list-secret-keys --keyid-format=long
#    gpg --export-secret-keys YOUR_KEY_ID | base64
#
# 3. Add these secrets to your GitHub repo
#    (Settings → Secrets and variables → Actions → New repository secret):
#      - OSSRH_USERNAME     : your Sonatype username
#      : your Sonatype password/token
#      - GPG_PRIVATE_KEY    : your base64-encoded GPG private key
#      - GPG_PASSPHRASE     : your GPG passphrase
#
# 4. Add the 'release' profile to pom.xml with:
#      - maven-source-plugin
#      - maven-javadoc-plugin
#      - maven-gpg-plugin
#      - nexus-staging-maven-plugin
#
# Until then, this workflow is dormant — it will not run on normal pushes.